# A ogni pubblicazione lancia i controlli automatici (test/controlli.mjs).
# Se qualcosa non va, GitHub manda un'email al proprietario del repository.
name: Controlli
on: [push, pull_request]
jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/controlli.mjs
