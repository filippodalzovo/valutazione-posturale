<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Nessuna connessione verso l'esterno: tutto (foto, video, modello) resta su questo Mac. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Valutazione Posturale</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-testi">
          <span class="app-nome"><img src="assets/logo-gymnasium.png" alt="Gymnasium" class="logo-club"> Valutazione Posturale</span>
          <span id="cliente-titolo" class="cliente-nome">Nuova valutazione</span>
          <span id="cliente-sotto" class="muted small"></span>
        </div>
        <span id="stato-salvataggio" class="badge" hidden>Modifiche non salvate</span>
      </div>
      <nav class="actions">
        <button data-action="home">Clienti</button>
        <details class="menu" id="menu-file"><summary>File</summary>
          <div class="menu-lista">
            <button data-action="nuova">Nuova valutazione</button>
            <button data-action="apri">Apri un file…</button>
            <button data-action="rivaluta">Rivalutazione dello stesso cliente</button>
            <button data-action="archivio">Confronta con una valutazione in archivio…</button>
            <button data-action="confronta">Confronta con un file…</button>
          </div>
        </details>
        <details class="menu" id="menu-report"><summary>Report</summary>
          <div class="menu-lista">
            <button data-action="stampa" data-tipo="tecnico">Report tecnico (PDF)<span class="muted small">tutte le misure, test e riferimenti</span></button>
            <button data-action="stampa" data-tipo="cliente">Report per il cliente (PDF)<span class="muted small">linguaggio semplice, sagoma e progressi</span></button>
          </div>
        </details>
        <button data-action="salva" class="primary">Salva</button>
      </nav>
    </header>
    <div id="prev-bar" class="prev-bar" hidden></div>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="anagrafica" class="active">Anagrafica <span class="tab-stato" data-stato="anagrafica"></span></button>
      <button role="tab" data-tab="foto">Foto <span class="tab-stato" data-stato="foto"></span></button>
      <button role="tab" data-tab="statica">Osservazione statica <span class="tab-stato" data-stato="statica"></span></button>
      <button role="tab" data-tab="video">Video <span class="tab-stato" data-stato="video"></span></button>
      <button role="tab" data-tab="test">Test funzionali <span class="tab-stato" data-stato="test"></span></button>
      <button role="tab" data-tab="riepilogo">Riepilogo <span class="tab-stato" data-stato="riepilogo"></span></button>
      <button role="tab" data-tab="conclusioni">Conclusioni <span class="tab-stato" data-stato="conclusioni"></span></button>
    </nav>

    <main>
      <section id="home" hidden></section>
      <section id="tab-anagrafica" class="tab" hidden></section>
      <section id="tab-foto" class="tab" hidden></section>
      <section id="tab-statica" class="tab" hidden></section>
      <section id="tab-video" class="tab" hidden></section>
      <section id="tab-test" class="tab" hidden></section>
      <section id="tab-riepilogo" class="tab" hidden></section>
      <section id="tab-conclusioni" class="tab" hidden></section>
    </main>
  </div>

  <div id="report" class="report"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-open" accept=".json,application/json" hidden>

  <script type="module" src="app.js"></script>
</body>
</html>
